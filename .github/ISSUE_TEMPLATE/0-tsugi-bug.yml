name: "Tsugi: report a cicada"
description: Report a reproducible bug in the independent Tsugi desktop application.
title: "bug(tsugi): "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a cicada. Search existing [Tsugi issues](https://github.com/G1NYU/TSUGI/issues) first.
        This report is public. Do not include passwords, API keys, session tokens, configured addon URLs, private media links, account addresses or unreviewed diagnostic logs.
        For a security-sensitive problem, do not post exploit details or secrets publicly. Use GitHub private vulnerability reporting if available, or request a private reporting channel without revealing details.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Startup and profiles
        - Movies and TV
        - Stremio and Nuvio addon management
        - Playback and subtitles
        - Refract and MDBList
        - Discord Rich Presence
        - Music
        - Reading
        - Vault and downloads
        - Settings, licenses and support
        - Updating and packaging
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Tsugi version or build
      description: In App settings, use Diagnostics to create and review the safe support summary. Paste it here, or enter the version and build from About Tsugi.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest repeatable sequence. Describe account or addon types without revealing personal data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional reviewed screenshots or error messages
      description: Remove all private information before uploading or pasting. Do not attach full profile databases, backup archives or raw provider logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I searched existing Tsugi issues and reviewed my report for sensitive information.
          required: true
