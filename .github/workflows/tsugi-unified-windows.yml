name: Unified Tsugi Windows Build

on:
  push:
    branches: [feature/tsugi-read-runtime]
    paths:
      - '.github/workflows/tsugi-unified-windows.yml'
      - 'packages/web/src/**'
      - 'packages/web/package.json'
      - 'packages/web/rsbuild.config.ts'
      - 'packages/web/tests/**'
      - 'packages/web/scripts/**'
      - 'packages/web/ebook-frame/**'
      - 'packages/web/public/tsugi-books/**'
      - 'packages/desktop/app/**'
      - 'packages/desktop/core/**'
      - 'packages/desktop/Cargo.lock'
      - 'packages/desktop/scripts/**'
      - 'packages/desktop/THIRD-PARTY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsugi-unified-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @aiostreams/core build
      - run: pnpm -F @aiostreams/web typecheck
      - run: pnpm -F @aiostreams/web lint
      - name: Verify pinned ebook engine preparation
        run: pnpm -F @aiostreams/web prepare:ebooks
      - name: Desktop navigation and music regression tests
        run: pnpm exec vitest run packages/web/tests/reader-utils.test.ts packages/web/tests/desktop-area.test.ts packages/web/tests/eclipse.test.ts packages/web/tests/music-connections.test.ts packages/web/tests/player-template.test.ts packages/web/tests/player-layout.test.ts packages/web/tests/music-feature-pack.test.ts packages/web/tests/music-lyrics.test.ts packages/web/tests/music-history.test.ts packages/web/tests/eclipse-appearance.test.ts packages/web/tests/music-library.test.ts packages/web/tests/audio-profiles.test.ts
      - name: Browser interaction smoke (no desktop packaging)
        run: |
          npm install --prefix "$RUNNER_TEMP/tsugi-reader-browser" --no-audit --no-fund --no-save playwright@1.58.2
          "$RUNNER_TEMP/tsugi-reader-browser/node_modules/.bin/playwright" install chromium
          pnpm -F @aiostreams/web i18n:extract
          pnpm -F @aiostreams/web dev:standalone --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/tsugi-reader-dev.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          export TSUGI_READER_PLAYWRIGHT="$RUNNER_TEMP/tsugi-reader-browser/node_modules/playwright/index.mjs"
          export TSUGI_DESIGN_SCREENSHOTS="$RUNNER_TEMP/tsugi-design-screenshots"
          if ! node packages/web/tests/reader-browser-smoke.mjs; then
            tail -80 "$RUNNER_TEMP/tsugi-reader-dev.log"
            exit 1
          fi
      - name: Upload synthetic UI previews
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tsugi-ui-previews
          path: ${{ runner.temp }}/tsugi-design-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build standalone web
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        run: pnpm -F @aiostreams/web build:standalone
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        with:
          name: tsugi-source-catalogs
          retention-days: 7
          path: |
            packages/web/src/locales/en-GB.po
            packages/web/src/locales/messages.pot
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        with:
          name: tsugi-standalone-web
          retention-days: 7
          path: packages/web/dist-standalone/
          include-hidden-files: true

  windows-check:
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[package tsugi]')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
      - name: Fetch pinned libmpv for x64
        shell: pwsh
        run: ./packages/desktop/scripts/fetch-libs.ps1 -Arch x86_64
      - name: Check native desktop and core without packaging
        working-directory: packages/desktop
        run: cargo check --locked --workspace
      - name: Run native core tests without packaging
        working-directory: packages/desktop
        run: cargo test --locked -p aiostreams-desktop-core --lib
      - name: Live TorBox authentication rejection probe (no account or submission)
        if: contains(github.event.head_commit.message, '[live vault smoke]')
        working-directory: packages/desktop
        continue-on-error: true
        run: cargo test --locked -p aiostreams-desktop-core --lib live_torbox_rejects_invalid_authentication -- --ignored --nocapture
      - name: Live authorized YouTube M4A export probe (no packaging)
        if: contains(github.event.head_commit.message, '[live vault smoke]')
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location packages/desktop
          try {
            $messages = cargo test --locked -p aiostreams-desktop-core --lib --no-run --message-format=json
            if ($LASTEXITCODE -ne 0) { throw 'Native test compilation failed' }
            $test = $messages | ForEach-Object { try { $_ | ConvertFrom-Json -ErrorAction Stop } catch {} } |
              Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'aiostreams_desktop_core' } |
              Select-Object -Last 1
            if (-not $test -or -not (Test-Path -LiteralPath $test.executable -PathType Leaf)) { throw 'Cannot locate actual native test executable' }
            $tools = Join-Path (Split-Path -Parent $test.executable) 'music-tools'
            ./scripts/fetch-music-tools.ps1 -Destination $tools
            & $test.executable live_youtube_export_writes_m4a --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Live YouTube export failed' }
          } finally { Pop-Location }

  windows-x64:
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
      - name: Fetch pinned libmpv for x64
        run: ./packages/desktop/scripts/fetch-libs.ps1 -Arch x86_64
      - name: Test native music and reading core
        working-directory: packages/desktop
        run: cargo test --locked -p aiostreams-desktop-core --lib
      - name: Build Windows desktop application
        working-directory: packages/desktop
        run: cargo build --locked --release
      - name: Stage native application and tools
        run: |
          $stage = New-Item -ItemType Directory -Force stage
          $current = New-Item -ItemType Directory -Force stage/current
          New-Item -ItemType File -Path "$stage/.portable" -Force | Out-Null
          Copy-Item packages/desktop/target/release/aiostreams-desktop.exe "$current/Tsugi.exe"
          Copy-Item packages/desktop/vendor/x86_64/*.dll $current
          Copy-Item packages/desktop/vendor/x86_64/licenses "$current/licenses" -Recurse
          Copy-Item packages/desktop/vendor/x86_64/vulkan "$current/vulkan" -Recurse
          Copy-Item packages/desktop/THIRD-PARTY.md $current
          ./packages/desktop/scripts/fetch-music-tools.ps1 -Destination "$current/music-tools"
          $launcher = New-Item -ItemType Directory -Force "$current/read-launcher"
          & "$env:JAVA_HOME_21_X64/bin/javac.exe" --release 21 -d $launcher packages/desktop/scripts/read-runtime/TsugiReadLauncher.java
          if ($LASTEXITCODE -ne 0) { throw 'Reading launcher compilation failed' }
          Copy-Item packages/desktop/scripts/fetch-read-tools.ps1 $launcher
          Copy-Item LICENSE $stage
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        with:
          name: tsugi-native-stage
          retention-days: 7
          path: stage/
          include-hidden-files: true

  package:
    needs: [web, windows-x64]
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: tsugi-native-stage
          path: stage
      - uses: actions/download-artifact@v5
        with:
          name: tsugi-standalone-web
          path: stage/current/web
      - name: Exercise native EXE reading preparation against assembled assets
        run: |
          $root = (Resolve-Path stage).Path
          $exe = Join-Path $root 'current/Tsugi.exe'
          $probe = Start-Process -FilePath $exe -ArgumentList '--check-reading-setup' -Wait -PassThru
          if ($probe.ExitCode -ne 2) { throw "Expected visible Read setup state before preparation, exit $($probe.ExitCode)" }
          $setup = Start-Process -FilePath $exe -ArgumentList '--prepare-reading' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Native reading preparation failed, exit $($setup.ExitCode)" }
          $probe = Start-Process -FilePath $exe -ArgumentList '--check-reading-setup' -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Packaged EXE does not detect the prepared reading runtime, exit $($probe.ExitCode)" }
          ./packages/desktop/scripts/test-read-runtime.ps1 -Runtime stage/current/read-tools
          $setup = Start-Process -FilePath $exe -ArgumentList '--prepare-reading' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Repeat native preparation failed' }
          foreach ($file in @('stage/current/read-tools/jre/bin/java.exe', 'stage/current/read-tools/bin/Suwayomi-Server.jar', 'stage/current/read-tools/launcher/TsugiReadLauncher.class', 'stage/current/music-tools/yt-dlp.exe', 'stage/current/music-tools/deno.exe')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Unified staging missing $file" }
          }
          # The user reproduces this verified setup directly from upstream.
          Remove-Item -LiteralPath stage/current/read-tools -Recurse -Force
      - name: Assemble and verify unified portable ZIP
        run: |
          @'
          TSUGI WINDOWS X64 DEVELOPMENT CANDIDATE

          Extract the complete ZIP into a writable folder.
          Open current/Tsugi.exe directly.
          Choose Read, then Set up reading on the first visit. Tsugi downloads
          and verifies the pinned reading runtime directly from upstream.
          Internet access is required once for this setup. No CMD is needed.

          Movies & TV, Music and Read run in the same Tsugi application.
          Keep the .portable marker; portable data is stored beside current/.
          Third-party reading extensions execute with your account permissions:
          install only trusted publishers. Signatures are not independently verified.
          This is a development ZIP, not a public release or installer.
          Physical Windows desktop and real-source acceptance testing are pending.
          '@ | Set-Content -Path stage/README-TEST.txt -Encoding utf8
          # Record the exact checkout, rather than asking testers to infer it
          # from the artifact name or the repository's moving branch.
          $build = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            ref = $env:GITHUB_REF
          }
          if ((git rev-parse HEAD).Trim() -ne $build.commit) { throw 'Package source revision mismatch' }
          $build | ConvertTo-Json | Set-Content -Path stage/BUILD-INFO.json -Encoding utf8
          $zip = [IO.Path]::GetFullPath('Tsugi-windows-x64-test.zip')
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path stage).Path, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @('.portable', 'current/Tsugi.exe', 'current/music-tools/yt-dlp.exe', 'current/music-tools/deno.exe', 'current/read-launcher/TsugiReadLauncher.class', 'current/read-launcher/fetch-read-tools.ps1', 'current/web/index.html', 'LICENSE', 'README-TEST.txt', 'BUILD-INFO.json')) {
              if ($required -notin $names) { throw "Unified artifact missing $required" }
            }
            if ('Start Tsugi.cmd' -in $names -or 'Start-Tsugi.ps1' -in $names) { throw 'Legacy manual launcher in Tsugi package' }
            if ('current/aiostreams-desktop.exe' -in $names) { throw 'Legacy executable name in Tsugi package' }
            if ($names -like 'current/read-tools/*') { throw 'Upstream reading runtime must be fetched directly on first launch' }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v7
        with:
          name: Tsugi-Windows-x64-test
          retention-days: 7
          path: Tsugi-windows-x64-test.zip
          if-no-files-found: error
