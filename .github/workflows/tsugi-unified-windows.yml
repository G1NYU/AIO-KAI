name: Unified Tsugi Windows Build

on:
  push:
    branches: [feature/tsugi-read-runtime]
    paths:
      - '.github/workflows/tsugi-unified-windows.yml'
      - 'packages/web/src/**'
      - 'packages/web/package.json'
      - 'packages/web/rsbuild.config.ts'
      - 'packages/web/tests/**'
      - 'packages/web/scripts/**'
      - 'packages/web/ebook-frame/**'
      - 'packages/web/public/tsugi-books/**'
      - 'packages/web/public/design/**'
      - 'packages/desktop/app/**'
      - 'packages/desktop/core/**'
      - 'packages/desktop/Cargo.lock'
      - 'packages/desktop/scripts/**'
      - 'packages/desktop/THIRD-PARTY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsugi-unified-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @aiostreams/core build
      - run: pnpm -F @aiostreams/web typecheck
      - run: pnpm -F @aiostreams/web lint
      - name: Verify pinned ebook engine preparation
        run: pnpm -F @aiostreams/web prepare:ebooks
      - name: Desktop navigation and music regression tests
        run: pnpm exec vitest run packages/web/tests/reader-utils.test.ts packages/web/tests/desktop-area.test.ts packages/web/tests/eclipse.test.ts packages/web/tests/music-connections.test.ts packages/web/tests/player-template.test.ts packages/web/tests/player-layout.test.ts packages/web/tests/music-feature-pack.test.ts packages/web/tests/music-lyrics.test.ts packages/web/tests/music-history.test.ts packages/web/tests/eclipse-appearance.test.ts packages/web/tests/music-library.test.ts packages/web/tests/audio-profiles.test.ts packages/web/tests/preferences-backup.test.ts packages/web/tests/music-backup.test.ts packages/web/tests/book-backup.test.ts packages/web/tests/manga-backup.test.ts packages/web/tests/portable-archive.test.ts packages/web/tests/manga-categories.test.ts packages/web/tests/managed-archive.test.ts packages/web/tests/backup-schedule.test.ts packages/web/tests/tsugi-release.test.ts packages/web/tests/restore-session.test.ts packages/web/tests/mihon-backup.test.ts packages/web/tests/download-cleanup.test.ts packages/web/tests/source-feed-preferences.test.ts packages/web/tests/source-feed.test.ts packages/web/tests/source-metadata.test.ts packages/web/tests/reader-settings-search.test.ts packages/web/tests/support-summary.test.ts packages/web/tests/reader-downloads.test.ts packages/web/tests/local-comic-import.test.ts
      - name: Browser interaction smoke (no desktop packaging)
        run: |
          npm install --prefix "$RUNNER_TEMP/tsugi-reader-browser" --no-audit --no-fund --no-save playwright@1.58.2
          "$RUNNER_TEMP/tsugi-reader-browser/node_modules/.bin/playwright" install chromium
          pnpm -F @aiostreams/web i18n:extract
          pnpm -F @aiostreams/web dev:standalone --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/tsugi-reader-dev.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          export TSUGI_READER_PLAYWRIGHT="$RUNNER_TEMP/tsugi-reader-browser/node_modules/playwright/index.mjs"
          export TSUGI_DESIGN_SCREENSHOTS="$RUNNER_TEMP/tsugi-design-screenshots"
          if ! node packages/web/tests/reader-browser-smoke.mjs; then
            tail -80 "$RUNNER_TEMP/tsugi-reader-dev.log"
            exit 1
          fi
      - name: Upload synthetic UI previews
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tsugi-ui-previews
          path: ${{ runner.temp }}/tsugi-design-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build standalone web
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        run: pnpm -F @aiostreams/web build:standalone
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        with:
          name: tsugi-source-catalogs
          retention-days: 7
          path: |
            packages/web/src/locales/en-GB.po
            packages/web/src/locales/messages.pot
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        with:
          name: tsugi-standalone-web
          retention-days: 7
          path: packages/web/dist-standalone/
          include-hidden-files: true

      - name: Check out corresponding Aria2 Next source
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        uses: actions/checkout@v7
        with:
          repository: AnInsomniacy/aria2-next
          ref: 2a13a664edb5314d86bfd7d488305266be6688e8
          path: upstream-aria2-next
          persist-credentials: false
      - name: Archive exact Aria2 Next source and notices
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        shell: bash
        run: |
          set -euo pipefail
          source=upstream-aria2-next
          test "$(git -C "$source" rev-parse HEAD)" = 2a13a664edb5314d86bfd7d488305266be6688e8
          test -z "$(git -C "$source" status --porcelain)"
          git -C "$source" ls-files --stage > "$RUNNER_TEMP/aria2-index.txt"
          if grep '^160000 ' "$RUNNER_TEMP/aria2-index.txt"; then
            echo 'Unexpected source submodule; refusing incomplete archive'
            exit 1
          fi
          out="$RUNNER_TEMP/tsugi-aria2-source"
          mkdir -p "$out"
          cp "$source/COPYING" "$source/AUTHORS" "$out/"
          tar -czf "$out/aria2-next-3.1.2-source.tar.gz" --exclude="$source/.git" "$source"
          tar -tzf "$out/aria2-next-3.1.2-source.tar.gz" > "$RUNNER_TEMP/aria2-source-contents.txt"
          for file in COPYING AUTHORS CMakeLists.txt packaging/scripts/build-release packaging/dependencies.env third_party/README.md; do
            grep -Fx "$source/$file" "$RUNNER_TEMP/aria2-source-contents.txt" >/dev/null
          done
          for vendor in boost curl doctest expat ffmpeg gpac libssh2 libtorrent nghttp2 openssl spdlog sqlite zlib; do
            grep -F "$source/third_party/$vendor/" "$RUNNER_TEMP/aria2-source-contents.txt" >/dev/null
          done
          (cd "$out" && sha256sum aria2-next-3.1.2-source.tar.gz > SOURCE.sha256)
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        with:
          name: tsugi-aria2-corresponding-source
          retention-days: 7
          path: ${{ runner.temp }}/tsugi-aria2-source/
          if-no-files-found: error

  windows-check:
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[package tsugi]')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
      - name: Fetch pinned libmpv for x64
        shell: pwsh
        run: ./packages/desktop/scripts/fetch-libs.ps1 -Arch x86_64
      - name: Check native desktop and core without packaging
        working-directory: packages/desktop
        run: cargo check --locked --workspace
      - name: Run native core tests without packaging
        working-directory: packages/desktop
        run: cargo test --locked -p aiostreams-desktop-core --lib
      - name: Live TorBox authentication rejection probe (no account or submission)
        if: contains(github.event.head_commit.message, '[live vault smoke]')
        working-directory: packages/desktop
        continue-on-error: true
        run: cargo test --locked -p aiostreams-desktop-core --lib live_torbox_rejects_invalid_authentication -- --ignored --nocapture
      - name: Live authorized YouTube M4A export probe (no packaging)
        if: contains(github.event.head_commit.message, '[live vault smoke]')
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location packages/desktop
          try {
            $messages = cargo test --locked -p aiostreams-desktop-core --lib --no-run --message-format=json
            if ($LASTEXITCODE -ne 0) { throw 'Native test compilation failed' }
            $test = $messages | ForEach-Object { try { $_ | ConvertFrom-Json -ErrorAction Stop } catch {} } |
              Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'aiostreams_desktop_core' } |
              Select-Object -Last 1
            if (-not $test -or -not (Test-Path -LiteralPath $test.executable -PathType Leaf)) { throw 'Cannot locate actual native test executable' }
            $tools = Join-Path (Split-Path -Parent $test.executable) 'music-tools'
            ./scripts/fetch-music-tools.ps1 -Destination $tools
            ./scripts/fetch-vault-tools.ps1 -Destination (Join-Path (Split-Path -Parent $test.executable) 'vault-tools')
            & $test.executable live_youtube_export_writes_m4a --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Live YouTube export failed' }
          } finally { Pop-Location }

  media-tools:
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: FFmpeg/FFmpeg
          ref: 38b88335f99e76ed89ff3c93f877fdefce736c13
          path: upstream-ffmpeg
          persist-credentials: false
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build and archive corresponding FFmpeg source
        run: |
          bash packages/desktop/scripts/build-media-tools.sh upstream-ffmpeg "$RUNNER_TEMP/tsugi-media-tools"
          rm -rf "$RUNNER_TEMP/tsugi-media-tools/build"
      - uses: actions/upload-artifact@v7
        with:
          name: tsugi-media-tools
          path: ${{ runner.temp }}/tsugi-media-tools/
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    needs: media-tools
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
      - name: Fetch pinned libmpv for x64
        run: ./packages/desktop/scripts/fetch-libs.ps1 -Arch x86_64
      - name: Test native music and reading core
        working-directory: packages/desktop
        run: cargo test --locked -p aiostreams-desktop-core --lib
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: tsugi-media-tools
          path: media-tools
      - name: Exercise native media validation with the actual bundled tools
        run: |
          Push-Location packages/desktop
          try {
            $messages = cargo test --locked -p aiostreams-desktop-core --lib --no-run --message-format=json
            if ($LASTEXITCODE -ne 0) { throw 'Native test compilation failed' }
            $test = $messages | ForEach-Object { try { $_ | ConvertFrom-Json -ErrorAction Stop } catch {} } |
              Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'aiostreams_desktop_core' } |
              Select-Object -Last 1
            if (-not $test -or -not (Test-Path -LiteralPath $test.executable -PathType Leaf)) { throw 'Native test executable missing' }
          } finally { Pop-Location }
          python tools/vault-evaluation/media_tools_probe.py media-tools "$($test.executable)"
          if ($LASTEXITCODE -ne 0) { throw 'Native FFmpeg fixture failed' }
      - name: Build Windows desktop application
        working-directory: packages/desktop
        run: cargo build --locked --release
      - name: Stage native application and tools
        run: |
          $stage = New-Item -ItemType Directory -Force stage
          $current = New-Item -ItemType Directory -Force stage/current
          New-Item -ItemType File -Path "$stage/.portable" -Force | Out-Null
          Copy-Item packages/desktop/target/release/aiostreams-desktop.exe "$current/Tsugi.exe"
          Copy-Item packages/desktop/vendor/x86_64/*.dll $current
          Copy-Item packages/desktop/vendor/x86_64/licenses "$current/licenses" -Recurse
          Copy-Item packages/desktop/vendor/x86_64/vulkan "$current/vulkan" -Recurse
          Copy-Item packages/desktop/THIRD-PARTY.md $current
          ./packages/desktop/scripts/fetch-music-tools.ps1 -Destination "$current/music-tools"
          ./packages/desktop/scripts/fetch-vault-tools.ps1 -Destination "$current/vault-tools"
          Copy-Item -LiteralPath media-tools -Destination "$current/media-tools" -Recurse
          $launcher = New-Item -ItemType Directory -Force "$current/read-launcher"
          & "$env:JAVA_HOME_21_X64/bin/javac.exe" --release 21 -d $launcher packages/desktop/scripts/read-runtime/TsugiReadLauncher.java
          if ($LASTEXITCODE -ne 0) { throw 'Reading launcher compilation failed' }
          if (@(Get-ChildItem -LiteralPath $launcher -Filter '*.class' -File -Recurse).Count -ne 1) {
            throw 'Reading setup copies one launcher class; update its explicit asset contract before adding companion classes'
          }
          Copy-Item packages/desktop/scripts/fetch-read-tools.ps1 $launcher
          Copy-Item LICENSE $stage
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
        with:
          name: tsugi-native-stage
          retention-days: 7
          path: stage/
          include-hidden-files: true

  package:
    needs: [web, windows-x64]
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[package tsugi]')))
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: tsugi-native-stage
          path: stage
      - uses: actions/download-artifact@v5
        with:
          name: tsugi-standalone-web
          path: stage/current/web
      - uses: actions/download-artifact@v5
        with:
          name: tsugi-aria2-corresponding-source
          path: stage/current/vault-tools/source
      - name: Verify assembled managed Vault engine and corresponding source
        run: |
          $root = (Resolve-Path stage).Path
          $exe = Join-Path $root 'current/Tsugi.exe'
          $tools = Join-Path $root 'current/vault-tools'
          $probe = Start-Process -FilePath $exe -ArgumentList '--check-vault-engine' -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw 'Packaged Tsugi cannot verify its managed Vault engine' }
          $source = Join-Path $tools 'source/aria2-next-3.1.2-source.tar.gz'
          $expected = ((Get-Content (Join-Path $tools 'source/SOURCE.sha256') -Raw).Trim() -split '\s+')[0]
          if ($expected.Length -ne 64 -or (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Corresponding source archive checksum mismatch' }
          foreach ($file in @('SOURCE.txt','source/COPYING','source/AUTHORS')) {
            if (-not (Test-Path -LiteralPath (Join-Path $tools $file) -PathType Leaf)) { throw "Missing engine notice: $file" }
          }
      - name: Verify assembled FFmpeg tools
        run: |
          $exe = (Resolve-Path stage/current/Tsugi.exe).Path
          $probe = Start-Process -FilePath $exe -ArgumentList '--check-media-tools' -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw 'Packaged Tsugi cannot verify FFmpeg tools' }
          $tools = (Resolve-Path stage/current/media-tools).Path
          foreach ($line in Get-Content (Join-Path $tools 'SHA256SUMS')) {
            $hash,$name = $line -split '  ',2
            if ($name -notin @('ffmpeg.exe','ffprobe.exe','source/ffmpeg-8.1.2-source.tar.gz')) { throw 'Unexpected media checksum path' }
            if ((Get-FileHash -LiteralPath (Join-Path $tools $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Media package checksum mismatch' }
          }
      - name: Exercise native EXE reading preparation against assembled assets
        run: |
          $root = (Resolve-Path stage).Path
          $exe = Join-Path $root 'current/Tsugi.exe'
          $probe = Start-Process -FilePath $exe -ArgumentList '--check-reading-setup' -Wait -PassThru
          if ($probe.ExitCode -ne 2) { throw "Expected visible Read setup state before preparation, exit $($probe.ExitCode)" }
          $setup = Start-Process -FilePath $exe -ArgumentList '--prepare-reading' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Native reading preparation failed, exit $($setup.ExitCode)" }
          $probe = Start-Process -FilePath $exe -ArgumentList '--check-reading-setup' -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Packaged EXE does not detect the prepared reading runtime, exit $($probe.ExitCode)" }
          ./packages/desktop/scripts/test-read-runtime.ps1 -Runtime stage/current/read-tools
          $setup = Start-Process -FilePath $exe -ArgumentList '--prepare-reading' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Repeat native preparation failed' }
          foreach ($file in @('stage/current/read-tools/jre/bin/java.exe', 'stage/current/read-tools/bin/Suwayomi-Server.jar', 'stage/current/read-tools/launcher/TsugiReadLauncher.class', 'stage/current/music-tools/yt-dlp.exe', 'stage/current/music-tools/deno.exe')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Unified staging missing $file" }
          }
          # The user reproduces this verified setup directly from upstream.
          Remove-Item -LiteralPath stage/current/read-tools -Recurse -Force
      - name: Assemble and verify unified portable ZIP
        run: |
          @'
          TSUGI WINDOWS X64 DEVELOPMENT CANDIDATE

          Extract the complete ZIP into a writable folder.
          Open current/Tsugi.exe directly.
          Choose Read, then Set up reading on the first visit. Tsugi downloads
          and verifies the pinned reading runtime directly from upstream.
          Internet access is required once for this setup. No CMD is needed.

          Movies & TV, Music, Read and Vault run in the same Tsugi application.
          Read, Music and Vault include the integrated visual redesign.
          Kitsu and Nekos provide optional decorative hero images. Fallback
          artwork and fonts are bundled for offline use; local artwork can be
          selected in any hero. Real title and album covers remain separate.
          Extract this candidate into a new folder; retain your working copy.
          Keep the .portable marker; portable data is stored beside current/.

          VAULT ACCEPTANCE
          Use Vault for direct-file downloads, batches, concurrency, and rate limits.
          Aria2 Next v3.1.2 is bundled and automatically used for eligible
          direct-file transfers. No setup or engine toggle is required.
          Incompatible sources use the built-in downloader or yt-dlp for music.
          Bundled FFmpeg and FFprobe validate downloaded M4A before publication.
          Original audio is retained; additional conversion formats are not enabled.
          FFmpeg source and notices are included under current/media-tools/source/.
          The engine's corresponding source and notices are included under
          current/vault-tools/source/.
          Test authorized music downloads and TorBox with your own account.
          Never share an API key, signed download URL or account credential.
          Third-party reading extensions execute with your account permissions:
          install only trusted publishers. Signatures are not independently verified.
          This is a portable release ZIP, not an installer.
          Physical Windows desktop and real-source acceptance testing are pending.
          '@ | Set-Content -Path stage/README-TEST.txt -Encoding utf8
          # Record the exact checkout, rather than asking testers to infer it
          # from the artifact name or the repository's moving branch.
          $build = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            ref = $env:GITHUB_REF
          }
          if ((git rev-parse HEAD).Trim() -ne $build.commit) { throw 'Package source revision mismatch' }
          $build | ConvertTo-Json | Set-Content -Path stage/BUILD-INFO.json -Encoding utf8
          $zip = [IO.Path]::GetFullPath('Tsugi-windows-x64-test.zip')
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path stage).Path, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @('current/vault-tools/aria2-next.exe', 'current/vault-tools/SOURCE.txt', 'current/vault-tools/source/COPYING', 'current/vault-tools/source/AUTHORS', 'current/vault-tools/source/SOURCE.sha256', 'current/vault-tools/source/aria2-next-3.1.2-source.tar.gz')) {
              if ($required -notin $names) { throw "Managed Vault artifact missing $required" }
            }
            foreach ($required in @('current/media-tools/ffmpeg.exe','current/media-tools/ffprobe.exe','current/media-tools/SHA256SUMS','current/media-tools/SOURCE.txt','current/media-tools/source/ffmpeg-8.1.2-source.tar.gz','current/media-tools/source/build-media-tools.sh','current/media-tools/source/COPYING.LGPLv2.1','current/media-tools/source/LICENSE.md','current/media-tools/source/config.mak')) {
              if ($required -notin $names) { throw "Media artifact missing $required" }
            }
            foreach ($required in @('.portable', 'current/Tsugi.exe', 'current/music-tools/yt-dlp.exe', 'current/music-tools/deno.exe', 'current/read-launcher/TsugiReadLauncher.class', 'current/read-launcher/fetch-read-tools.ps1', 'current/web/index.html', 'LICENSE', 'README-TEST.txt', 'BUILD-INFO.json')) {
              if ($required -notin $names) { throw "Unified artifact missing $required" }
            }
            foreach ($asset in @('yomi/hero-torii.webp','oto/hero-yuna.webp','kura/hero-kura.webp','shared/hero-neon.webp','shared/hero-train.webp')) {
              if ("current/web/design/$asset" -notin $names) { throw "Redesign artwork missing $asset" }
            }
            foreach ($font in @('amanojaku','interface-regular','interface-medium','interface-semibold','noto-jp')) {
              if (-not ($names | Where-Object { $_ -match ("^current/web/.*" + [regex]::Escape($font) + "[.-].*\.(otf|woff2)$") })) {
                throw "Redesign font missing $font"
              }
            }
            if ('Start Tsugi.cmd' -in $names -or 'Start-Tsugi.ps1' -in $names) { throw 'Legacy manual launcher in Tsugi package' }
            if ('current/aiostreams-desktop.exe' -in $names) { throw 'Legacy executable name in Tsugi package' }
            if ($names -like 'current/read-tools/*') { throw 'Upstream reading runtime must be fetched directly on first launch' }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v7
        with:
          name: Tsugi-Windows-x64-test
          retention-days: 7
          path: Tsugi-windows-x64-test.zip
          if-no-files-found: error

  publish-release:
    needs: [package]
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime' && github.event_name == 'push' && contains(github.event.head_commit.message, '[release tsugi]') && contains(github.event.head_commit.message, '[package tsugi]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Tsugi-Windows-x64-test
          path: release
      - name: Verify package identity and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.1.0
          cd release
          mv Tsugi-windows-x64-test.zip Tsugi-windows-x64.zip
          python - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile("Tsugi-windows-x64.zip") as archive:
              info = json.loads(archive.read("BUILD-INFO.json").decode("utf-8-sig"))
              assert info["commit"] == os.environ["GITHUB_SHA"]
              assert info["run_id"] == os.environ["GITHUB_RUN_ID"]
              assert "current/Tsugi.exe" in archive.namelist()
              assert "LICENSE" in archive.namelist()
              assert archive.testzip() is None
          PY
          sha256sum Tsugi-windows-x64.zip > SHA256SUMS.txt
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          cat > notes.md <<EOF
          First official Windows x64 release of Tsugi. Includes the Vault overflow and reader setup improvements from Preview 2, contiguous album track tables, and Dot Wave as the default visualizer for new settings. Existing explicit visualizer preferences are preserved.

          - Movies & TV through the AIOStreams / Stremio addon and Jellyfin-compatible ecosystem.
          - Music, local library, saved albums and collections, native YouTube Music, Eclipse sources and fullscreen visualizers.
          - Mihon-compatible reading repositories, local EPUB/PDF and the Vault download workspace.

          Download **Tsugi-windows-x64.zip**, extract the entire archive and run \`current/Tsugi.exe\`. Keep the companion files and \`.portable\` marker. This is a portable release, not an installer; Windows may warn about the unsigned executable. The reading runtime is fetched and verified on first setup. Back up existing portable data before replacing files.

          Automated validation and package checks passed. Live provider compatibility, hardware-specific performance and physical-machine acceptance remain subject to testing. Native YouTube Music cold-start latency is unchanged.

          Corresponding Tsugi source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}
          Third-party notices and source references: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/packages/desktop/THIRD-PARTY.md
          Validation: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          License: AGPL-3.0; bundled components retain their respective licenses. See included notices and source archives.
          EOF
          gh release create "$tag" Tsugi-windows-x64.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tsugi v0.1.0 — Windows" --notes-file notes.md --draft
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          printf '%s\n' SHA256SUMS.txt Tsugi-windows-x64.zip | sort > expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,tagName
