name: Desktop Music Validation

on:
  push:
    branches:
      - feature/desktop-music-entry
    paths:
      - '.github/workflows/desktop-music-check.yml'
      - 'packages/web/src/app.tsx'
      - 'packages/web/src/app/music/**'
      - 'packages/web/src/app/desktop-landing/**'
      - 'packages/web/src/components/shell/layout.tsx'
      - 'packages/web/src/lib/music/**'
      - 'packages/web/src/lib/desktop-area.tsx'
      - 'packages/web/tests/**'
  pull_request:
    paths:
      - '.github/workflows/desktop-music-check.yml'
      - 'packages/web/src/app.tsx'
      - 'packages/web/src/app/music/**'
      - 'packages/web/src/app/desktop-landing/**'
      - 'packages/web/src/components/shell/layout.tsx'
      - 'packages/web/src/lib/music/**'
      - 'packages/web/src/lib/desktop-area.tsx'
      - 'packages/web/tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-music-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, lint, test and desktop assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck web application
        run: pnpm -F @aiostreams/web typecheck
      - name: Lint web application
        run: pnpm -F @aiostreams/web lint
      - name: Test Eclipse addon adapter
        run: pnpm exec vitest run packages/web/tests/eclipse.test.ts
      - name: Build standalone desktop web assets
        run: pnpm -F @aiostreams/web build:standalone
