name: Vault Aria2 Next evaluation
on:
  push:
    branches: [feature/tsugi-read-runtime]
    paths:
      - 'tools/vault-evaluation/aria2_probe.py'
      - 'packages/desktop/core/src/vault_gateway.rs'
      - 'packages/desktop/core/src/vault_engine.rs'
      - 'packages/desktop/core/Cargo.toml'
      - 'packages/desktop/Cargo.lock'
      - 'packages/desktop/core/examples/vault_engine_probe.rs'
      - '.github/workflows/tsugi-vault-engine-evaluation.yml'
permissions:
  contents: read
jobs:
  engine-fixtures:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
      - name: Fetch pinned libmpv for native example
        shell: pwsh
        run: ./packages/desktop/scripts/fetch-libs.ps1 -Arch x86_64
      - name: Build native RPC evaluation client
        working-directory: packages/desktop
        shell: pwsh
        run: |
          $messages = cargo build --locked -p aiostreams-desktop-core --example vault_engine_probe --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Native RPC example compilation failed' }
          $example = $messages | ForEach-Object { try { $_ | ConvertFrom-Json -ErrorAction Stop } catch {} } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.target.name -eq 'vault_engine_probe' } |
            Select-Object -Last 1
          if (-not $example -or -not (Test-Path -LiteralPath $example.executable -PathType Leaf)) { throw 'Cannot locate native RPC example' }
          "TSUGI_ENGINE_PROBE=$($example.executable)" >> $env:GITHUB_ENV
      - name: Fetch and verify exact evaluation binary
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'aria2-next-3.1.2.exe'
          Invoke-WebRequest -Uri 'https://github.com/AnInsomniacy/aria2-next/releases/download/v3.1.2/aria2-next-3.1.2-windows-x86_64.exe' -OutFile $binary
          $digest = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '94edc284cd84dec26a16ae9431378c5ab9e5cde8011482566483f4f0cb20c03f') { throw 'Aria2 Next digest mismatch' }
          python -m py_compile tools/vault-evaluation/aria2_probe.py
          python tools/vault-evaluation/aria2_probe.py $binary $env:TSUGI_ENGINE_PROBE
          if ($LASTEXITCODE -ne 0) { throw 'Engine evaluation failed' }
      - name: Remove standalone evaluation binary
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'aria2-next-3.1.2.exe') -Force -ErrorAction SilentlyContinue
