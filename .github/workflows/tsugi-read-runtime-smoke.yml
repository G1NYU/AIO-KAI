name: Tsugi Read Runtime Smoke

on:
  push:
    branches: [feature/tsugi-read-runtime]
    paths:
      - '.github/workflows/tsugi-read-runtime-smoke.yml'
      - 'packages/desktop/scripts/fetch-read-tools.ps1'
      - 'packages/desktop/scripts/test-read-runtime.ps1'
      - 'packages/desktop/scripts/read-runtime/**'
      - 'packages/desktop/core/src/read_runtime.rs'
      - 'packages/desktop/core/src/read_extension_update.rs'
      - 'packages/desktop/core/src/read_checkpoint.rs'
      - 'packages/desktop/core/src/read_download_cleanup.rs'
      - 'packages/desktop/core/src/read_download_cleanup_tests.rs'
      - 'packages/desktop/core/src/read_downloads.rs'
      - 'packages/desktop/core/src/read_downloads_tests.rs'
      - 'packages/desktop/core/src/read_feed_tests.rs'
      - 'packages/desktop/core/src/read_metadata_tests.rs'
      - 'packages/desktop/core/src/read_icons.rs'
      - 'packages/desktop/core/src/read_source_preferences.rs'
      - 'packages/desktop/core/src/read_source_preferences_tests.rs'
      - 'packages/desktop/core/src/lib.rs'
      - 'packages/desktop/core/Cargo.toml'
      - 'packages/desktop/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsugi-read-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.ref == 'refs/heads/feature/tsugi-read-runtime'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and verify pinned reading runtime
        run: ./packages/desktop/scripts/fetch-read-tools.ps1 -Destination "$env:RUNNER_TEMP/tsugi-read-runtime"
      - name: Validate isolated local reading server
        run: ./packages/desktop/scripts/test-read-runtime.ps1 -Runtime "$env:RUNNER_TEMP/tsugi-read-runtime"
      - name: Compile Tsugi-owned parent-lifetime launcher
        run: |
          $javac = Join-Path $env:JAVA_HOME_21_X64 'bin/javac.exe'
          if (-not (Test-Path -LiteralPath $javac -PathType Leaf)) { throw 'Windows runner JDK 21 is missing' }
          $destination = "$env:RUNNER_TEMP/tsugi-read-runtime/launcher"
          New-Item -ItemType Directory -Force $destination | Out-Null
          & $javac --release 21 -d $destination packages/desktop/scripts/read-runtime/TsugiReadLauncher.java
          if ($LASTEXITCODE -ne 0) { throw 'Tsugi reading launcher compilation failed' }
      - name: Compile original test-only extension against pinned runtime
        run: |
          $java = Join-Path $env:JAVA_HOME_21_X64 'bin'
          $runtime = "$env:RUNNER_TEMP/tsugi-read-runtime"
          $classes = "$env:RUNNER_TEMP/tsugi-read-fixture-classes"
          $fixtures = Join-Path $runtime 'test-fixtures'
          New-Item -ItemType Directory -Force $classes, $fixtures | Out-Null
          & "$java/javac.exe" --release 21 -cp "$runtime/bin/Suwayomi-Server.jar" -d $classes packages/desktop/scripts/read-runtime/fixture/FixtureSource.java packages/desktop/scripts/read-runtime/fixture/ChangedSource.java
          if ($LASTEXITCODE -ne 0) { throw 'Original extension fixture compilation failed' }
          Copy-Item packages/desktop/scripts/read-runtime/fixture/AndroidManifest.xml $classes
          & "$java/jar.exe" --create --file "$fixtures/tsugi-fixture-v1.6.1.jar" -C $classes .
          if ($LASTEXITCODE -ne 0) { throw 'Original extension fixture packaging failed' }
          Copy-Item packages/desktop/scripts/read-runtime/fixture/AndroidManifest-v2.xml "$classes/AndroidManifest.xml" -Force
          & "$java/jar.exe" --create --file "$fixtures/tsugi-fixture-v1.6.2.jar" -C $classes .
          if ($LASTEXITCODE -ne 0) { throw 'Updated extension fixture packaging failed' }
          Copy-Item packages/desktop/scripts/read-runtime/fixture/AndroidManifest-changed-source.xml "$classes/AndroidManifest.xml" -Force
          & "$java/jar.exe" --create --file "$fixtures/tsugi-fixture-v1.6.3.jar" -C $classes .
          if ($LASTEXITCODE -ne 0) { throw 'Incompatible-source extension fixture packaging failed' }
          # Keep the existing extension-update artifacts unchanged. The cleanup
          # source serves only original PNGs on its own ephemeral loopback port.
          $downloadClasses = "$env:RUNNER_TEMP/tsugi-read-download-fixture-classes"
          New-Item -ItemType Directory -Force $downloadClasses | Out-Null
          & "$java/javac.exe" --release 21 -cp "$runtime/bin/Suwayomi-Server.jar" -d $downloadClasses packages/desktop/scripts/read-runtime/fixture/FixtureSource.java packages/desktop/scripts/read-runtime/fixture/DownloadFixtureSource.java
          if ($LASTEXITCODE -ne 0) { throw 'Original download fixture compilation failed' }
          Copy-Item packages/desktop/scripts/read-runtime/fixture/AndroidManifest-downloads.xml "$downloadClasses/AndroidManifest.xml"
          & "$java/jar.exe" --create --file "$fixtures/tsugi-download-fixture-v1.6.1.jar" -C $downloadClasses .
          if ($LASTEXITCODE -ne 0) { throw 'Original download fixture packaging failed' }
          $feedClasses = "$env:RUNNER_TEMP/tsugi-read-feed-fixture-classes"
          New-Item -ItemType Directory -Force $feedClasses | Out-Null
          & "$java/javac.exe" --release 21 -cp "$runtime/bin/Suwayomi-Server.jar" -d $feedClasses packages/desktop/scripts/read-runtime/fixture/FixtureSource.java packages/desktop/scripts/read-runtime/fixture/DownloadFixtureSource.java packages/desktop/scripts/read-runtime/fixture/FeedFixtureSource.java packages/desktop/scripts/read-runtime/fixture/FeedFixtureFactory.java
          if ($LASTEXITCODE -ne 0) { throw 'Original Feed fixture compilation failed' }
          Copy-Item packages/desktop/scripts/read-runtime/fixture/AndroidManifest-feed.xml "$feedClasses/AndroidManifest.xml"
          & "$java/jar.exe" --create --file "$fixtures/tsugi-feed-fixture-v1.6.1.jar" -C $feedClasses .
          if ($LASTEXITCODE -ne 0) { throw 'Original Feed fixture packaging failed' }
          $metadataClasses = "$env:RUNNER_TEMP/tsugi-read-metadata-fixture-classes"
          New-Item -ItemType Directory -Force $metadataClasses | Out-Null
          & "$java/javac.exe" --release 21 -cp "$runtime/bin/Suwayomi-Server.jar" -d $metadataClasses packages/desktop/scripts/read-runtime/fixture/FixtureSource.java packages/desktop/scripts/read-runtime/fixture/DownloadFixtureSource.java packages/desktop/scripts/read-runtime/fixture/MetadataFixtureSource.java packages/desktop/scripts/read-runtime/fixture/MetadataFixtureFactory.java
          if ($LASTEXITCODE -ne 0) { throw 'Original metadata fixture compilation failed' }
          Copy-Item packages/desktop/scripts/read-runtime/fixture/AndroidManifest-metadata.xml "$metadataClasses/AndroidManifest.xml"
          & "$java/jar.exe" --create --file "$fixtures/tsugi-metadata-fixture-v1.6.1.jar" -C $metadataClasses .
          if ($LASTEXITCODE -ne 0) { throw 'Original metadata fixture packaging failed' }
          $settingsClasses = "$env:RUNNER_TEMP/tsugi-read-settings-fixture-classes"
          New-Item -ItemType Directory -Force $settingsClasses | Out-Null
          & "$java/javac.exe" --release 21 -cp "$runtime/bin/Suwayomi-Server.jar" -d $settingsClasses packages/desktop/scripts/read-runtime/fixture/FixtureSource.java packages/desktop/scripts/read-runtime/fixture/DownloadFixtureSource.java packages/desktop/scripts/read-runtime/fixture/SettingsFixtureSource.java
          if ($LASTEXITCODE -ne 0) { throw 'Original source settings fixture compilation failed' }
          Copy-Item packages/desktop/scripts/read-runtime/fixture/AndroidManifest-settings.xml "$settingsClasses/AndroidManifest.xml"
          & "$java/jar.exe" --create --file "$fixtures/tsugi-settings-fixture-v1.6.1.jar" -C $settingsClasses .
          if ($LASTEXITCODE -ne 0) { throw 'Original source settings fixture packaging failed' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
      - name: Validate native reading broker
        working-directory: packages/desktop
        run: 'cargo test --locked -p aiostreams-desktop-core --lib read_runtime:: -- --skip packaged_runtime'
      - name: Exercise native broker against packaged server
        working-directory: packages/desktop
        run: |
          $env:TSUGI_READ_RUNTIME = "$env:RUNNER_TEMP/tsugi-read-runtime"
          $env:TSUGI_READ_FIXTURE = "$env:RUNNER_TEMP/tsugi-read-native-fixture"
          New-Item -ItemType Directory -Path $env:TSUGI_READ_FIXTURE | Out-Null
          try {
            cargo test --locked -p aiostreams-desktop-core --lib packaged_runtime -- --ignored --test-threads=1 --nocapture
            if ($LASTEXITCODE -ne 0) {
              # Only fixed markers from runtime logs, never raw messages, URLs,
              # config, headers or credentials. Both tests run independently.
              $markers = @('ConnectException', 'SocketTimeoutException', 'UnknownHostException',
                'IOException', 'SerializationException', 'MissingFieldException',
                'IllegalArgumentException', 'IllegalStateException', 'ConfigException',
                'SSLHandshakeException', 'BindException', 'SocketException',
                'Failed to fetch extension store', 'Shutting down HikariCP',
                'Failed to sync preference store', 'AccessDeniedException',
                'FileSystemException', 'SQLException', 'JdbcSQL', 'NoClassDefFoundError')
              foreach ($kind in @('library', 'stores', 'extension', 'extension-update', 'download-cleanup-folder', 'download-cleanup-cbz', 'download-cleanup-locked', 'download-actions', 'feed', 'metadata', 'source-settings')) {
                $logs = Join-Path $env:TSUGI_READ_FIXTURE "$kind/logs"
                if (Test-Path -LiteralPath $logs) {
                  foreach ($marker in $markers) {
                    if (Get-ChildItem -LiteralPath $logs -Filter '*.log' -File | Select-String -SimpleMatch -Pattern $marker -Quiet) {
                      Write-Host "Reading $kind log marker: $marker"
                    }
                  }
                }
              }
              throw 'Native reading runtime test failed'
            }
          } finally {
            if (Test-Path -LiteralPath $env:TSUGI_READ_FIXTURE) {
              Remove-Item -LiteralPath $env:TSUGI_READ_FIXTURE -Recurse -Force
            }
          }
