name: Update v0.1.2 release description

on:
  push:
    branches: [feature/tsugi-read-runtime]
    paths: ['docs/releases/v0.1.2.md']

permissions:
  contents: read

jobs:
  edit-notes:
    if: github.repository == 'G1NYU/TSUGI' && contains(github.event.head_commit.message, '[update v0.1.2 notes]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Edit description only and verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases/461660616"
          tag_api="repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.2"
          sha="b3f071d7b5054a794499d9630068afbe38070f7d"
          gh api "$api" > "$RUNNER_TEMP/release-before.json"
          jq -e --arg sha "$sha" '.id==461660616 and .tag_name=="v0.1.2" and .target_commitish==$sha and .draft==false and .prerelease==false and .updated_at=="2026-11-28T15:37:08Z" and ([.assets[].id]|sort)==[805058513,805058519] and any(.assets[]; .id==805058519 and .digest=="sha256:aae2677a512e63a2b2e08a64e38c4b6ec53439cb68b9df12fb1fce973dabb582")' "$RUNNER_TEMP/release-before.json" >/dev/null
          gh api "$tag_api" | jq -e --arg sha "$sha" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          jq -n --rawfile body docs/releases/v0.1.2.md '{body:$body}' | gh api --method PATCH "$api" --input - > "$RUNNER_TEMP/release-after.json"
          jq -e --rawfile expected docs/releases/v0.1.2.md '.body==$expected' "$RUNNER_TEMP/release-after.json" >/dev/null
          for state in before after; do
            jq -S '{id,tag_name,name,target_commitish,draft,prerelease,published_at,assets:(.assets|map({id,name,size,digest,state})|sort_by(.id))}' "$RUNNER_TEMP/release-$state.json" > "$RUNNER_TEMP/identity-$state.json"
          done
          cmp "$RUNNER_TEMP/identity-before.json" "$RUNNER_TEMP/identity-after.json"
          gh api "$tag_api" | jq -e --arg sha "$sha" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          echo "PASS: release description updated; tag, title, visibility and existing asset identities unchanged."
