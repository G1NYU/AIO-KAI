name: Tsugi Music Playback Smoke

on:
  push:
    branches: [test/music-playback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsugi-music-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-audio:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop
      - name: Fetch the same pinned libmpv as Tsugi
        run: ./packages/desktop/scripts/fetch-libs.ps1 -Arch x86_64
      - name: Generate licensed-free test tones
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'tsugi-audio-test')
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:duration=3' -c:a aac -movflags +faststart (Join-Path $dir.FullName 'tone.m4a')
          if ($LASTEXITCODE -ne 0) { throw 'AAC fixture generation failed' }
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:duration=3' -c:a libopus (Join-Path $dir.FullName 'tone.webm')
          if ($LASTEXITCODE -ne 0) { throw 'Opus fixture generation failed' }
          $library = Get-ChildItem packages/desktop/vendor/x86_64 -File | Where-Object { $_.Name -match '^(lib)?mpv(-2)?\.dll$' } | Select-Object -First 1
          if (-not $library) { throw 'Pinned libmpv DLL missing' }
          "TSUGI_TEST_MPV=$($library.FullName)" >> $env:GITHUB_ENV
          "TSUGI_TEST_MEDIA_DIR=$($dir.FullName)" >> $env:GITHUB_ENV
      - name: Native core unit tests
        id: core_tests
        working-directory: packages/desktop
        run: cargo test --locked -p aiostreams-desktop-core --lib
      - name: Headless native decoder (AAC and Opus)
        working-directory: packages/desktop
        run: cargo test --locked -p aiostreams-desktop-core --lib music_stream::tests::headless_fixture_playback -- --ignored --nocapture
      - name: Assemble standalone diagnostic (no app build)
        id: diagnostic
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        working-directory: packages/desktop
        run: |
          $lines = cargo test --locked -p aiostreams-desktop-core --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic compilation failed' }
          $exe = $lines | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'aiostreams_desktop_core' } | Select-Object -Last 1 -ExpandProperty executable
          if (-not $exe) { throw 'Core test executable not found' }
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'tsugi-diagnostic')
          Copy-Item -LiteralPath $exe (Join-Path $dir.FullName 'tsugi-music-smoke.exe')
          Copy-Item scripts/music-smoke-local.ps1 $dir.FullName
          "TSUGI_DIAGNOSTIC_DIR=$($dir.FullName)" >> $env:GITHUB_ENV
      - name: Upload standalone diagnostic
        if: ${{ !cancelled() && steps.diagnostic.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: Tsugi-music-diagnostic
          path: ${{ env.TSUGI_DIAGNOSTIC_DIR }}
          retention-days: 7
      - name: Controlled HTTPS ranges and decoder
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        run: python packages/desktop/scripts/music-smoke-https.py
      # The old anonymous resolver already hit LOGIN_REQUIRED on this runner.
      # Test the reference resolver on a public licensed sample instead; do
      # not attempt to solve or bypass any provider verification.
      - name: Fetch pinned reference resolver
        id: reference_resolver
        if: ${{ !cancelled() && steps.core_tests.outcome == 'success' }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'yt-dlp.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp.exe' -OutFile $exe
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '622ed48023cac1daa52a3bf3a6ac38f03514de214b5f0fa069389fd0f6d17e5c') { throw 'Reference resolver checksum mismatch' }
          "TSUGI_TEST_YTDLP=$exe" >> $env:GITHUB_ENV
      - name: Reference resolver, opening and tail bytes, decoder
        if: ${{ !cancelled() && steps.reference_resolver.outcome == 'success' }}
        working-directory: packages/desktop
        run: cargo test --locked -p aiostreams-desktop-core --lib music_stream::tests::headless_reference_playback -- --ignored --nocapture
      - name: Check native formatting
        if: always()
        working-directory: packages/desktop
        run: cargo fmt --check
